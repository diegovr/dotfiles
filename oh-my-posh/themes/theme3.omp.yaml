# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

transient_prompt:
    template: ' '
    foreground: '#FEF5ED'
    background: transparent
blocks:
    - type: prompt
      alignment: left
      segments:
        - properties:
            cache_duration: none
            mapped_locations:
                /Users/diego/Code/dotfiles: '  /dotfiles'
            style: agnoster_full
          template: '  {{ .Path }} '
          foreground: '#98bede'
          type: path
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - properties:
            cache_duration: none
            display_host: true
          leading_diamond: <#d58694> (</>
          trailing_diamond: '<#d58694>)</> '
          template: '{{ .UserName }}'
          foreground: '#c3ccdc'
          type: session
          style: diamond
        - properties:
            cache_duration: none
          template: '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
          foreground: '#6ca35e'
          type: node
          style: diamond
        - properties:
            cache_duration: none
          template: <#fcd041> (</>{{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}<#fcd041>)</>
          foreground: '#3770a1'
          type: python
          style: diamond
        - properties:
            cache_duration: none
          template: ' <#808080>❯</><#cdcdcd>❯</><#ffffff>❯</>'
          foreground: '#FEF5ED'
          type: text
          style: plain
      newline: true
    - type: rprompt
      alignment: right
      segments:
        - properties:
            cache_duration: none
            fetch_status: true
            fetch_worktree_count: true
          template: <#14A5AE>  {{ .HEAD }} [</>{{if .BranchStatus }}{{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}<#14A5AE>]</>
          foreground: '#e67e80'
          type: git
          style: diamond
        - properties:
            cache_duration: none
          template: ' {{if .Env.DOCKER_HOST }} {{ .Context }} {{ end }}'
          foreground: '#64a3e2'
          type: docker
          style: diamond
version: 3
final_space: true
